name: Dogfood Coverage
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.1"
      - run: bun install
      - run: bun test --coverage --coverage-reporter=lcov

      # On PRs: post comment with delta from baseline
      - if: github.event_name == 'pull_request'
        uses: ./
        with:
          head-lcov-file: coverage/lcov.info
          baseline-from: coverage-baseline
          thresholds: "60 80"
          show-badge: "true"
          show-branch-coverage: "true"

      # On push to main: update the baseline
      - if: github.event_name == 'push'
        uses: ./
        with:
          head-lcov-file: coverage/lcov.info
          save-baseline: coverage-baseline
